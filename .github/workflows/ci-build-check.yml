name: CI Build Check

# 触发条件（自建，刻意不复用现有 build-test.yml 的触发）：
#   - 现有 build-test.yml 的 pull_request 仅对 dev 分支生效，
#     而本仓库实际开发分支是 workbuddy/master-4c015332，
#     向它提 PR 不会触发 build-test.yml —— 这正是本工作流要补上的缺口。
#   - 因此这里显式声明 push / pull_request 且【不加 branches 过滤】，对任意分支生效。
#   - 额外加 workflow_dispatch，便于手动验证。
on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支/PR 上重复推送时，取消仍在进行的旧运行，避免排队与资源浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    # 该构建是纯 JS bundle 打包（无原生编译），通常数分钟内完成；
    # 设 30 分钟上限防止异常挂起。
    timeout-minutes: 30

    steps:
      # 1) 检出代码
      - name: Check out git repository
        uses: actions/checkout@v4

      # 2) 配置 Node 运行时
      #
      # 版本锚定：node-version-file: .nvmrc（仓库根 .nvmrc 内容为 v18），
      # 不硬编码版本号，避免出现既有 build-test.yml 里硬编码 node 20 与 .nvmrc 不一致的问题。
      #
      # 依赖缓存：cache: npm —— 这是 setup-node 官方内建缓存机制，
      # 以 package-lock.json 内容哈希自动作为缓存 key（本项目为 npm 项目，存在 package-lock.json 无 yarn.lock）。
      #
      # 【为什么不复用仓库自带的 ./.github/actions/setup】
      # 该 composite action 的缓存步骤实际是失效的，已实测确认：
      #   它用 `path: ${{ steps.npm-cache-dir.outputs.cachedir }}` 指定缓存目录，
      #   但在 composite action 中，除非显式声明 outputs 块，
      #   否则后续步骤无法读取内部步骤的 outputs，该表达式求值为空字符串，
      #   导致 actions/cache 报 "Path Validation Error: Path(s) specified in the action
      #   for caching do(es) not exist, hence no cache is being saved."
      #   实测证据：连续两轮运行该步骤耗时均为 108s，零提速，坐实缓存从未保存。
      # 因此这里改为在本工作流内直接使用官方 cache: npm 机制，使缓存真正生效。
      # 注：本改动仅作用于本工作流，未修改上游共享的 .github/actions/setup/action.yml。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # 3) 配置 Java 运行时（React Native 工具链需要 JDK 17）
      # 与项目既有约定一致：distribution microsoft / java-version 17。
      #
      # 【为什么不开 cache: gradle】
      # 本工作流只做 JS bundle 打包（npm run build-test），不调用 gradle，
      # 因此不会生成 ~/.gradle 目录。实测确认：开启 cache: gradle 后，
      # 该步骤每次运行都报
      #   "Path Validation Error: Path(s) specified in the action for caching
      #    do(es) not exist, hence no cache is being saved."
      # 且仓库中从未产生任何 gradle 缓存条目（实测 gradle 缓存数为 0），
      # 纯属无效开销与误导性告警，故此处不开启。
      # 若将来本工作流引入原生编译（assemble*），再另行评估开启。
      - name: Setup Java Env
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      # 4) 安装依赖（与项目包管理器 npm 一致，ci 模式严格按 lockfile 安装）
      - name: Install dependencies
        run: npm ci

      # 5) 静态检查（与项目既有 CI 一致）
      - name: Eslint check
        run: npm run lint

      # 6) 编译校验
      #
      # 选用 `npm run build-test` 的依据：
      #   - 它是仓库【既有】且【已在 CI 中使用过】的构建命令
      #     （见 .github/workflows/build-test.yml 的 "Test Build" 步骤），
      #     不新增/自创命令，保证与项目既有方式一致。
      #   - 其内容为 `react-native bundle --platform android --dev true ...`，
      #     仅做 JS bundle 打包，【不需要 keystore】。
      #   - 相对地，assembleRelease / assembleDebug 会走 android/app/build.gradle 的
      #     signingConfigs 逻辑：当无 MYAPP_UPLOAD_STORE_FILE property 时会加载
      #     rootProject.file("keystore.properties")，而该文件被 .gitignore 忽略、CI 上不存在，
      #     会在配置阶段抛 FileNotFoundException。故本工作流【严禁】跑任何 assemble* 任务。
      - name: Test Build (JS bundle, keystore-free)
        run: npm run build-test
